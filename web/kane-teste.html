<title>Kane Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Ecrã de arcada único (tema escuro fixo): canvas a todo o ecrã, controlos de toque nos cantos */
:root {
  --bg: #0d1016;
  --panel: #161b24;
  --gold: #c8973f;
  --visor: #e2333f;
  --energy: #5fb8ff;
  --ink: #e8e3d6;
  --muted: #8a8f9c;
  --pixel: "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: var(--pixel);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
#stage { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

.pad { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.pad.left {
  left: max(16px, env(safe-area-inset-left, 0px));
  grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px);
}
.pad.right {
  right: max(16px, env(safe-area-inset-right, 0px));
  grid-template-columns: repeat(2, 70px); grid-template-rows: repeat(2, 62px);
}
.btn {
  border: 2px solid color-mix(in srgb, var(--ink) 25%, transparent);
  background: color-mix(in srgb, var(--panel) 70%, transparent);
  color: var(--ink); font: 11px/1 var(--pixel); border-radius: 12px;
  display: grid; place-items: center; text-align: center; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.btn.on { background: color-mix(in srgb, var(--ink) 30%, transparent); transform: scale(.95); }
.btn[data-k="up"] { grid-column: 2; grid-row: 1; }
.btn[data-k="left"] { grid-column: 1; grid-row: 2; }
.btn[data-k="down"] { grid-column: 2; grid-row: 2; }
.btn[data-k="right"] { grid-column: 3; grid-row: 2; }
.btn.laser { border-color: var(--visor); color: var(--visor); }
.btn.punch { border-color: var(--energy); color: var(--energy); }
.btn.fly, .btn.jump { border-color: var(--gold); color: var(--gold); }
.btn small { display: block; font-size: 8px; color: var(--muted); margin-top: 3px; }

#help {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 10px; color: var(--muted); text-align: right; line-height: 1.6; max-width: 46ch;
}
#rotate {
  position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
  background: var(--panel); border: 2px solid var(--gold); padding: 12px 16px;
  font-size: 12px; text-align: center; display: none; max-width: 80vw;
}
@media (orientation: portrait) and (max-width: 700px) { #rotate { display: block; } #help { display: none; } }
@media (hover: hover) and (pointer: fine) { .pad { opacity: .55; } }
</style>

<div id="stage"><canvas id="c"></canvas></div>
<div id="help">Teclado: WASD/setas · Espaço salto · Shift voo · J laser · K soco<br>Toque: manter SOCO e soltar = soco de energia</div>
<div id="rotate">Roda o iPhone para a horizontal</div>

<div class="pad left">
  <button class="btn" data-k="up" aria-label="Cima">▲</button>
  <button class="btn" data-k="left" aria-label="Esquerda">◀</button>
  <button class="btn" data-k="down" aria-label="Baixo">▼</button>
  <button class="btn" data-k="right" aria-label="Direita">▶</button>
</div>
<div class="pad right">
  <button class="btn fly" data-k="fly">VOO</button>
  <button class="btn laser" data-k="laser">LASER<small>manter</small></button>
  <button class="btn jump" data-k="jump">SALTO</button>
  <button class="btn punch" data-k="punch">SOCO<small>manter = energia</small></button>
</div>

<script>
// Porta em JavaScript de scripts/kane/kane_player.gd — mesmos valores e regras.
const C = {
  maxHp: 100, maxFury: 100, furyRegen: 8, invuln: 0.6,
  runSpeed: 220, groundAccel: 1800, groundFriction: 2400, airAccel: 1100,
  gravity: 1400, fallMult: 1.5, maxFall: 900, jumpVel: -480, jumpCut: 0.45,
  coyote: 0.1, jumpBuffer: 0.12,
  flightSpeed: 320, flightAccel: 1600,
  eye: { x: 15, y: -97 }, laserRange: 640, laserWindup: 0.12, laserDps: 45, laserTick: 0.1,
  laserFuryPerSec: 30, laserMinFury: 10, laserMoveMult: 0.35, laserKnock: 60,
  punchDmg: 18, punchKnock: 320, punchWindup: 0.07, punchActive: 0.1, punchRecovery: 0.16,
  punchLunge: 180, punchSize: { w: 44, h: 52 }, punchOff: { x: 28, y: -72 }, furyOnHit: 6,
  chargeTime: 0.4, energyCost: 25, energyDmgMult: 2.5, energyKnockMult: 2.2, energySizeMult: 1.6,
  bodyW: 28, bodyH: 108,
};
const COL = { gold: "#c8973f", goldDark: "#8a6424", visor: "#e2333f", blue: "#2f4f9a", blueLight: "#4a74c9",
  suit: "#1a1d26", suitLight: "#2a2f3c", cape: "#1f2a33", capeEdge: "#30404c", energy: "#5fb8ff" };

// ---------------------------------------------------------------- mundo
const WORLD_W = 2200;
const solids = [
  { x: -100, y: 500, w: WORLD_W + 200, h: 200 },          // chão
  { x: -100, y: -400, w: 100, h: 1100 },                   // parede esq.
  { x: WORLD_W, y: -400, w: 100, h: 1100 },                // parede dir.
  { x: 760, y: 360, w: 200, h: 20 },
  { x: 1100, y: 270, w: 160, h: 20 },
  { x: 1300, y: 360, w: 240, h: 20 },
];
const enemies = [];
function spawnEnemy(x) { enemies.push({ x, y: 500, vx: 0, vy: 0, w: 34, h: 130, hp: 120, maxHp: 120, flash: 0, dead: 0, home: x }); }
[620, 1000, 1500, 1900].forEach(spawnEnemy);

const k = {
  x: 320, y: 500, vx: 0, vy: 0, facing: 1, hp: C.maxHp, fury: C.maxFury,
  flying: false, onFloor: false, action: "none", t: 0, coyote: 0, jumpBuf: 0, invuln: 0,
  laserTick: 0, energy: false, hitIds: new Set(), beam: null, anim: 0, dead: false,
};
let shake = 0, floats = [];

// ---------------------------------------------------------------- FX
// Partículas reutilizadas (sem alocações por frame). layer: "back" atrás do Kane, "front" à frente.
const POOL = Array.from({ length: 360 }, () => ({ live: 0 }));
function spawn(o) {
  for (const p of POOL) if (p.live <= 0) {
    Object.assign(p, { vx: 0, vy: 0, size: 2, grav: 0, drag: 0.9, add: true, layer: "front", shrink: true }, o);
    p.max = p.live; return p;
  }
}
function burst(x, y, n, { speed = 200, life = 0.35, color = "#9ff3ff", dir = 0, spread = Math.PI * 2, size = 2, grav = 0, drag = 0.9, add = true, layer = "front" } = {}) {
  for (let i = 0; i < n; i++) {
    const a = dir + (Math.random() - 0.5) * spread, v = speed * (0.4 + Math.random() * 0.8);
    spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, live: life * (0.6 + Math.random() * 0.6), color, size, grav, drag, add, layer });
  }
}
// partículas que convergem para um ponto (antecipação de laser e carga do soco)
function converge(x, y, n, radius, color, life = 0.18) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = radius * (0.7 + Math.random() * 0.5);
    spawn({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, vx: -Math.cos(a) * r / life, vy: -Math.sin(a) * r / life, live: life, color, size: 2, drag: 1 });
  }
}
// pó: dir é o ângulo de saída (−π/2 = para cima, −0.35 = direita-cima, −π+0.35 = esquerda-cima)
function dust(x, y, n, dir = -Math.PI / 2, spread = Math.PI, speed = 90) {
  burst(x, y - 2, n, { speed, life: 0.45, color: "#6b6f7c", dir, spread, size: 3, grav: -40, drag: 0.88, add: false, layer: "back" });
}
const rings = [];   // ondas de choque / anéis: {x,y,t,dur,r0,r1,color,width,arc,facing}
function ring(o) { rings.push(Object.assign({ t: 0, dur: 0.3, r0: 6, r1: 60, color: "#9ff3ff", width: 6, arc: Math.PI, facing: 1, rot: 0 }, o)); }
const ghosts = [];  // imagens-fantasma em voo: {x,y,row,col,facing,t}
let hitstop = 0, screenFlash = 0;

function updateFx(dt) {
  for (const p of POOL) if (p.live > 0) {
    p.live -= dt; p.vy += p.grav * dt; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--) if ((rings[i].t += dt) >= rings[i].dur) rings.splice(i, 1);
  for (let i = ghosts.length - 1; i >= 0; i--) if ((ghosts[i].t -= dt) <= 0) ghosts.splice(i, 1);
  screenFlash = Math.max(0, screenFlash - dt);
}
function drawParticles(layer) {
  for (const p of POOL) if (p.live > 0 && p.layer === layer) {
    const k01 = p.live / p.max;
    ctx.globalCompositeOperation = p.add ? "lighter" : "source-over";
    ctx.globalAlpha = p.add ? k01 : k01 * 0.6;
    ctx.fillStyle = p.color;
    const sz = p.shrink ? Math.max(1, p.size * (0.5 + k01)) : p.size;
    ctx.fillRect(Math.round(p.x - sz / 2), Math.round(p.y - sz / 2), sz, sz);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}
function drawRings() {
  ctx.globalCompositeOperation = "lighter";
  for (const r of rings) {
    const k01 = r.t / r.dur, e = 1 - Math.pow(1 - k01, 3);   // ease-out: expande rápido e abranda
    ctx.save(); ctx.translate(r.x, r.y); ctx.scale(r.facing, r.squashY ? 0.3 : 1); ctx.rotate(r.rot);
    ctx.globalAlpha = 1 - k01; ctx.strokeStyle = r.color; ctx.lineWidth = Math.max(1, r.width * (1 - k01));
    ctx.beginPath(); ctx.arc(0, 0, r.r0 + (r.r1 - r.r0) * e, -r.arc / 2, r.arc / 2); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

// ---------------------------------------------------------------- input
const held = {}, prev = {};
const pressed = n => held[n] && !prev[n];
const released = n => !held[n] && prev[n];
const KEYMAP = { KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right", KeyW: "up", ArrowUp: "up",
  KeyS: "down", ArrowDown: "down", Space: "jump", ShiftLeft: "fly", ShiftRight: "fly", KeyF: "fly", KeyJ: "laser", KeyK: "punch" };
addEventListener("keydown", e => { if (KEYMAP[e.code]) { held[KEYMAP[e.code]] = true; e.preventDefault(); } });
addEventListener("keyup", e => { if (KEYMAP[e.code]) held[KEYMAP[e.code]] = false; });
document.querySelectorAll(".btn").forEach(b => {
  const n = b.dataset.k;
  const on = e => { e.preventDefault(); held[n] = true; b.classList.add("on"); try { b.setPointerCapture(e.pointerId); } catch {} };
  const off = () => { held[n] = false; b.classList.remove("on"); };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("lostpointercapture", off);
  b.addEventListener("contextmenu", e => e.preventDefault());
});
document.addEventListener("gesturestart", e => e.preventDefault());

// ---------------------------------------------------------------- física
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const bodyRect = (o, w, h) => ({ x: o.x - w / 2, y: o.y - h, w, h });
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);

function moveAndSlide(o, w, h, dt) {
  o.onFloor = false;
  o.x += o.vx * dt;
  for (const s of solids) {
    const r = bodyRect(o, w, h);
    if (overlap(r, s)) { o.x = o.vx > 0 ? s.x - w / 2 : s.x + s.w + w / 2; o.vx = 0; }
  }
  o.y += o.vy * dt;
  for (const s of solids) {
    const r = bodyRect(o, w, h);
    if (overlap(r, s)) {
      if (o.vy > 0) { o.y = s.y; o.onFloor = true; } else { o.y = s.y + s.h + h; }
      o.vy = 0;
    }
  }
  if (!o.onFloor) { // contacto exato com o chão
    const probe = bodyRect(o, w, h); probe.y += 1;
    o.onFloor = o.vy >= 0 && solids.some(s => overlap(probe, s));
  }
}

function rayAABB(ox, oy, dx, dy, r) {
  let tmin = 0, tmax = Infinity;
  for (const [o, d, lo, hi] of [[ox, dx, r.x, r.x + r.w], [oy, dy, r.y, r.y + r.h]]) {
    if (Math.abs(d) < 1e-9) { if (o < lo || o > hi) return Infinity; continue; }
    let t1 = (lo - o) / d, t2 = (hi - o) / d;
    if (t1 > t2) [t1, t2] = [t2, t1];
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return Infinity;
  }
  return tmin;
}

function hitEnemy(e, dmg, kx, ky) {
  e.hp -= dmg; e.vx += kx; e.vy += ky; e.flash = 0.1; e.squash = 0.15;
  floats.push({ x: e.x + (Math.random() * 20 - 10), y: e.y - e.h - 10, v: Math.round(dmg), t: 0.7, big: dmg > 30 });
  if (e.hp <= 0) {
    e.dead = 2.5;
    // desfaz-se em cinzas (o Colecionador de Cinzas)
    for (let i = 0; i < 70; i++) {
      const x = e.x + (Math.random() - 0.5) * e.w, y = e.y - Math.random() * e.h;
      const ember = Math.random() < 0.3;
      spawn({ x, y, vx: (Math.random() - 0.5) * 60 + kx * 0.1, vy: -30 - Math.random() * 90, live: 0.8 + Math.random() * 0.8,
        color: ember ? "#ff8a3d" : "#7d7f86", size: ember ? 2 : 3, grav: -20, drag: 0.97, add: ember, layer: "front" });
    }
    ring({ x: e.x, y: e.y - e.h / 2, r0: 10, r1: 70, arc: Math.PI * 2, color: "#ff8a3d", width: 4, dur: 0.4 });
  }
}

// ---------------------------------------------------------------- Kane
function setFlying(on) {
  if (on === k.flying) return;
  k.flying = on;
  if (on) {
    k.vy = Math.min(k.vy, 0);
    // descolagem: anel ciano achatado nos pés + jato
    ring({ x: k.x, y: k.y, r0: 8, r1: 46, arc: Math.PI * 2, color: "#9ff3ff", width: 5, dur: 0.35, squashY: true });
    burst(k.x, k.y, 18, { speed: 220, dir: Math.PI / 2, spread: 1.6, color: "#9ff3ff", life: 0.3 });
    burst(k.x, k.y, 8, { speed: 160, dir: Math.PI / 2, spread: 0.8, color: "#ff3344", life: 0.25 });
  }
}
function start(a) { k.action = a; k.t = 0; }
function setFury(v) { k.fury = Math.max(0, Math.min(C.maxFury, v)); }

function inputVec() {
  let x = (held.right ? 1 : 0) - (held.left ? 1 : 0), y = (held.down ? 1 : 0) - (held.up ? 1 : 0);
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  return { x, y };
}

function updateKane(dt) {
  if (k.dead) { k.vy = Math.min(k.vy + C.gravity * dt, C.maxFall); k.vx = approach(k.vx, 0, C.groundFriction * dt); moveAndSlide(k, C.bodyW, C.bodyH, dt); return; }
  const inp = inputVec();
  if (pressed("jump")) k.jumpBuf = C.jumpBuffer;
  if (pressed("fly")) setFlying(!k.flying);
  if (k.action === "none" || k.action === "charge") { if (inp.x > 0.1) k.facing = 1; else if (inp.x < -0.1) k.facing = -1; }

  k.jumpBuf = Math.max(k.jumpBuf - dt, 0);
  k.invuln = Math.max(k.invuln - dt, 0);
  k.coyote = k.onFloor ? C.coyote : Math.max(k.coyote - dt, 0);

  const wasFloor = k.onFloor, fallSpeed = k.vy, wasAction = k.action, hadBeam = k.beam;
  // ações
  k.t += dt; k.beam = null;
  if (k.action === "none") {
    if (pressed("laser") && k.fury >= C.laserMinFury) { start("laser"); k.laserTick = 0; }
    else if (pressed("punch")) start("charge");
  } else if (k.action === "charge") {
    const charged = k.t >= C.chargeTime && k.fury >= C.energyCost;
    const fx = k.x + 38 * k.facing, fy = k.y - 66;
    if (Math.random() < (charged ? 0.9 : 0.5)) converge(fx, fy, 1, 34, charged ? "#9ff3ff" : "#ff3344");
    if (charged && !k.chargedPing) {   // aviso de carga completa
      k.chargedPing = true;
      ring({ x: fx, y: fy, r0: 4, r1: 34, arc: Math.PI * 2, color: "#ffffff", width: 3, dur: 0.22 });
      burst(fx, fy, 10, { speed: 160, color: "#9ff3ff", life: 0.25 });
    }
    if (!held.punch) {
      k.chargedPing = false;
      k.energy = k.t >= C.chargeTime && k.fury >= C.energyCost;
      if (k.energy) setFury(k.fury - C.energyCost);
      k.hitIds.clear(); start("punch");
      k.vx += k.facing * C.punchLunge * (k.energy ? 1.5 : 1);
    }
  } else if (k.action === "punch") {
    if (k.t >= C.punchWindup && k.t - dt < C.punchWindup) punchImpactFx();
    if (k.t >= C.punchWindup && k.t < C.punchWindup + C.punchActive) punchQuery();
    else if (k.t >= C.punchWindup + C.punchActive + C.punchRecovery) start("none");
  } else if (k.action === "laser") {
    const ex = k.x + C.eye.x * k.facing, ey = k.y + C.eye.y;
    if (!held.laser || k.fury <= 0) {
      start("none");
      if (hadBeam) {   // retração do feixe + fumo e faíscas no visor
        k.beamFade = { ...hadBeam, t: 0.1 };
        burst(ex, ey, 10, { speed: 90, color: "#ff6b74", life: 0.3 });
        burst(ex, ey, 6, { speed: 30, color: "#4a4d57", life: 0.7, size: 4, grav: -50, add: false, drag: 0.95 });
      }
    } else if (k.t >= C.laserWindup) fireLaser(dt, inp);
    else converge(ex, ey, 2, 26, Math.random() < 0.5 ? "#ff3344" : "#ffd6da", 0.1);   // antecipação
  }

  // locomoção
  const mult = { laser: C.laserMoveMult, punch: 0, charge: 0.5 }[k.action] ?? 1;
  if (k.flying) {
    const tx = inp.x * C.flightSpeed * mult, ty = inp.y * C.flightSpeed * mult;
    const dx = tx - k.vx, dy = ty - k.vy, d = Math.hypot(dx, dy), step = C.flightAccel * dt;
    if (d <= step) { k.vx = tx; k.vy = ty; } else { k.vx += dx / d * step; k.vy += dy / d * step; }
    if (k.onFloor && inp.y > 0.5) setFlying(false);
  } else {
    const tx = inp.x * C.runSpeed * mult;
    const acc = k.onFloor ? (tx === 0 ? C.groundFriction : C.groundAccel) : C.airAccel;
    k.vx = approach(k.vx, tx, acc * dt);
    k.vy = Math.min(k.vy + C.gravity * (k.vy > 0 ? C.fallMult : 1) * dt, C.maxFall);
    const canJump = k.action !== "punch" && k.action !== "laser";
    if (k.jumpBuf > 0 && canJump) {
      if (k.coyote > 0) { k.vy = C.jumpVel; k.jumpBuf = 0; k.coyote = 0; }
      else if (pressed("jump")) { setFlying(true); k.jumpBuf = 0; }
    }
    if (released("jump") && k.vy < 0) k.vy *= C.jumpCut;
  }
  const jumped = k.vy === C.jumpVel;
  moveAndSlide(k, C.bodyW, C.bodyH, dt);
  if (k.y < 70) { k.y = 70; k.vy = Math.max(k.vy, 0); }   // teto do nível
  movementFx(dt, wasFloor, fallSpeed, jumped);

  if (k.action !== "laser") setFury(k.fury + C.furyRegen * dt);
  k.anim += dt;

  // contacto com inimigos = dano
  const kr = bodyRect(k, C.bodyW, C.bodyH);
  for (const e of enemies) if (!e.dead && k.invuln <= 0 && overlap(kr, bodyRect(e, e.w, e.h))) {
    k.hp = Math.max(0, k.hp - 10); k.invuln = C.invuln; k.vx = Math.sign(k.x - e.x || 1) * 260; k.vy = -220;
    start("none"); shake = 6; if (k.hp <= 0) { k.dead = true; k.flying = false; setTimeout(respawn, 1500); }
  }
}

function movementFx(dt, wasFloor, fallSpeed, jumped) {
  k.squash = Math.max(0, (k.squash || 0) - dt);
  if (jumped) { k.stretch = 0.12; dust(k.x, k.y + 1, 8, -Math.PI / 2, Math.PI * 0.9, 70); }
  k.stretch = Math.max(0, (k.stretch || 0) - dt);
  if (k.onFloor && !wasFloor && fallSpeed > 250) {          // aterragem: achatar + pó + tremor
    k.squash = 0.12;
    dust(k.x - 10, k.y, 7, -Math.PI + 0.35, 0.6, 130);
    dust(k.x + 10, k.y, 7, -0.35, 0.6, 130);
    if (fallSpeed > 600) { shake = Math.max(shake, 5); ring({ x: k.x, y: k.y, r0: 10, r1: 60, arc: Math.PI, rot: -Math.PI / 2, color: "#c8973f", width: 3, dur: 0.25 }); }
  }
  const speed = Math.hypot(k.vx, k.vy);
  if (k.onFloor && !k.flying && Math.abs(k.vx) > 60) {      // pó dos passos (2 por ciclo de 4 frames)
    k.stepT = (k.stepT || 0) + dt;
    if (k.stepT > 1 / 6) { k.stepT = 0; dust(k.x - 14 * Math.sign(k.vx), k.y, 3, k.vx > 0 ? -Math.PI + 0.5 : -0.5, 0.7, 60); }
  }
  if (k.flying) {
    if (speed > 80) {                                       // rasto de energia nos pés
      const bx = k.x - 30 * Math.sign(k.vx || k.facing), by = k.y - 26;
      spawn({ x: bx + (Math.random() - 0.5) * 8, y: by + (Math.random() - 0.5) * 8, vx: -k.vx * 0.3, vy: -k.vy * 0.3,
        live: 0.25, color: Math.random() < 0.7 ? "#9ff3ff" : "#ff3344", size: 3, layer: "back" });
    } else if (Math.random() < 0.35) {                      // pairar: faúlhas a cair dos jatos
      spawn({ x: k.x + (Math.random() - 0.5) * 20, y: k.y + 4, vx: (Math.random() - 0.5) * 20, vy: 60 + Math.random() * 60,
        live: 0.35, color: Math.random() < 0.6 ? "#9ff3ff" : "#ff3344", size: 2, layer: "back" });
    }
    k.ghostT = (k.ghostT || 0) + dt;
    if (speed > 220 && k.ghostT > 0.045 && k.action === "none") {   // imagens-fantasma
      k.ghostT = 0;
      const [row, col] = kaneFrame();
      ghosts.push({ x: k.x, y: k.y, row, col, facing: k.facing, tilt: flightTilt(), t: 0.22 });
    }
  }
}

function flightTilt() {
  if (!k.flying || Math.abs(k.vx) < 25) return 0;
  return Math.max(-0.22, Math.min(0.22, k.vy / C.flightSpeed * 0.25));   // sobe = nariz para cima
}

function punchImpactFx() {
  const s = k.energy ? 1.4 : 1;
  const fx = k.x + 44 * k.facing, fy = k.y - 78;
  ring({ x: fx, y: fy, r0: 8, r1: 46 * s, arc: Math.PI * 0.9, color: "#9ff3ff", width: 7 * s, dur: 0.22, facing: k.facing });
  if (k.energy) {
    ring({ x: fx, y: fy, r0: 14, r1: 90, arc: Math.PI * 0.8, color: "#ff3344", width: 5, dur: 0.32, facing: k.facing });
    ring({ x: fx, y: fy, r0: 4, r1: 24, arc: Math.PI * 2, color: "#ffffff", width: 4, dur: 0.12 });
    shake = Math.max(shake, 6);
  }
  burst(fx, fy, k.energy ? 24 : 10, { speed: k.energy ? 360 : 220, dir: k.facing > 0 ? 0 : Math.PI, spread: 1.4, color: "#9ff3ff", life: 0.3 });
  // speed lines atrás do braço
  for (let i = 0; i < 5; i++) spawn({ x: k.x + (10 - i * 10) * k.facing, y: k.y - 70 - (Math.random() - 0.5) * 30,
    vx: -k.facing * 500, vy: 0, live: 0.12, color: "#e8e3d6", size: 2, drag: 1, layer: "back", shrink: false });
}

function respawn() { Object.assign(k, { x: 320, y: 500, vx: 0, vy: 0, hp: C.maxHp, fury: C.maxFury, dead: false, invuln: 1, action: "none" }); }

function fireLaser(dt, inp) {
  let dx = k.facing, dy = 0;
  if (inp.y < -0.5) { dx = k.facing * Math.SQRT1_2; dy = -Math.SQRT1_2; }
  else if (inp.y > 0.5 && !k.onFloor) { dx = k.facing * Math.SQRT1_2; dy = Math.SQRT1_2; }
  const ox = k.x + C.eye.x * k.facing, oy = k.y + C.eye.y;
  let best = C.laserRange, target = null;
  for (const s of solids) { const t = rayAABB(ox, oy, dx, dy, s); if (t < best) { best = t; target = null; } }
  for (const e of enemies) if (!e.dead) { const t = rayAABB(ox, oy, dx, dy, bodyRect(e, e.w, e.h)); if (t < best) { best = t; target = e; } }
  k.beam = { ox, oy, ex: ox + dx * best, ey: oy + dy * best, hit: best < C.laserRange, dx, dy };
  if (k.beam.hit) {                    // faíscas no ponto de impacto, a saltar para trás
    burst(k.beam.ex, k.beam.ey, 2, { speed: 260, dir: Math.atan2(-dy, -dx), spread: 1.8, color: Math.random() < 0.5 ? "#ffd6da" : "#ff3344", life: 0.25, grav: 500 });
    if (Math.random() < 0.3) spawn({ x: k.beam.ex, y: k.beam.ey, vx: (Math.random() - 0.5) * 30, vy: -40, live: 0.6, color: "#4a4d57", size: 4, grav: -40, add: false, drag: 0.95 });
  }
  if (Math.random() < 0.4) {           // brasas ao longo do feixe
    const u = Math.random() * best;
    spawn({ x: ox + dx * u, y: oy + dy * u, vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40, live: 0.2, color: "#ff6b74", size: 2 });
  }
  shake = Math.max(shake, 1.2);
  if (target) {
    k.laserTick += dt;
    if (k.laserTick >= C.laserTick) { k.laserTick -= C.laserTick; hitEnemy(target, C.laserDps * C.laserTick, dx * C.laserKnock, dy * C.laserKnock); }
  }
  setFury(k.fury - C.laserFuryPerSec * dt);
}

function punchQuery() {
  const s = k.energy ? C.energySizeMult : 1;
  const w = C.punchSize.w * s, h = C.punchSize.h * s;
  const cx = k.x + C.punchOff.x * s * k.facing, cy = k.y + C.punchOff.y;
  const box = { x: cx - w / 2, y: cy - h / 2, w, h };
  const dmg = C.punchDmg * (k.energy ? C.energyDmgMult : 1), kb = C.punchKnock * (k.energy ? C.energyKnockMult : 1);
  enemies.forEach((e, i) => {
    if (e.dead || k.hitIds.has(i) || !overlap(box, bodyRect(e, e.w, e.h))) return;
    k.hitIds.add(i);
    const n = Math.hypot(1, 0.35);
    hitEnemy(e, dmg, k.facing / n * kb, -0.35 / n * kb);
    setFury(k.fury + C.furyOnHit);
    shake = k.energy ? 12 : 5;
    hitstop = k.energy ? 0.13 : 0.06;          // congela o jogo uns ticks: o golpe "pesa"
    if (k.energy) screenFlash = 0.08;
    const hx = e.x - k.facing * e.w / 2, hy = k.y - 76;
    burst(hx, hy, k.energy ? 30 : 14, { speed: k.energy ? 420 : 260, dir: k.facing > 0 ? 0 : Math.PI, spread: 2.2, color: "#ffffff", life: 0.22 });
    burst(hx, hy, 10, { speed: 200, color: k.energy ? "#9ff3ff" : "#ffd27a", life: 0.3 });
  });
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) { e.dead -= dt; if (e.dead <= 0) Object.assign(e, { dead: 0, hp: e.maxHp, x: e.home, y: 500, vx: 0, vy: 0 }); continue; }
    e.vy = Math.min(e.vy + 1400 * dt, 900);
    e.vx = approach(e.vx, 0, 1200 * dt);
    moveAndSlide(e, e.w, e.h, dt);
    e.flash = Math.max(e.flash - dt, 0);
    e.squash = Math.max((e.squash || 0) - dt, 0);
  }
  floats = floats.filter(f => (f.t -= dt) > 0);
}

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let viewW = 960, viewH = 540, scale = 1, camX = 0, safeTop = 0, safeLeft = 0;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(innerWidth / 640, innerHeight / 540) * dpr;
  viewW = cv.width / scale; viewH = cv.height / scale;
  ctx.imageSmoothingEnabled = false;
  const probe = document.getElementById("rotate"), cs = getComputedStyle(document.documentElement);
  safeTop = (parseFloat(cs.paddingTop) || 0) * dpr / scale;
  safeLeft = (parseFloat(getComputedStyle(document.querySelector(".pad.left")).left) - 16 || 0) * dpr / scale;
}
addEventListener("resize", resize); resize();

const ROW = { idle: 0, move: 1, punch: 2 };

function kaneFrame() {
  const moving = Math.abs(k.vx) > 25;
  if (k.action === "laser" || k.action === "charge") return [ROW.punch, 0];
  if (k.action === "punch") {
    const t = k.t, w = C.punchWindup, a = C.punchActive, r = C.punchRecovery;
    return [ROW.punch, t < w ? 1 : t < w + a ? 2 : t < w + a + r * 0.5 ? 3 : 4];
  }
  if (moving || (!k.onFloor && !k.flying)) return [ROW.move, Math.floor(k.anim * 12) % 4];
  return [ROW.idle, Math.floor(k.anim * 8) % 4];
}

function glow(x, y, r, color, alpha) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = r;
  ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function drawKane() {
  if (!ATLAS.complete || !ATLAS.naturalWidth) return;
  if (k.invuln > 0 && Math.floor(k.invuln * 20) % 2) return;
  const [row, col] = kaneFrame();
  const hover = k.flying && row === ROW.idle ? Math.sin(k.anim * 4) * 3 : 0;
  const sq = (k.squash || 0) / 0.12, st = (k.stretch || 0) / 0.12;
  ctx.save();
  ctx.translate(k.x, k.y + hover);
  ctx.scale(k.facing * (1 + sq * 0.12 - st * 0.06), 1 - sq * 0.1 + st * 0.08);   // achatar/esticar a partir dos pés
  const tilt = flightTilt();
  if (tilt) { ctx.translate(0, -60); ctx.rotate(-tilt); ctx.translate(0, 60); }
  if (k.dead) ctx.rotate(-1.3);

  if (k.action === "charge") {         // aura atrás do corpo
    const grow = Math.min(k.t / C.chargeTime, 1);
    ctx.globalCompositeOperation = "lighter";
    glow(10, -64, 30 + grow * 24, "#ff3344", 0.12 + 0.18 * grow);
    ctx.globalCompositeOperation = "source-over";
  }

  // jatos de energia nos pés quando paira (como na "postura normal")
  if (k.flying && row === ROW.idle) {
    const p = 0.6 + 0.3 * Math.sin(k.anim * 20);
    ctx.globalAlpha = p; ctx.fillStyle = "#9ff3ff"; ctx.shadowColor = "#4ee4e5"; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.ellipse(-4, 2, 22, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff3344"; ctx.globalAlpha = p * 0.6;
    ctx.beginPath(); ctx.moveTo(-14, 4); ctx.lineTo(-4, 22 + 6 * p); ctx.lineTo(6, 4); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  ctx.drawImage(ATLAS, col * FW, row * FH, FW, FH, -OX, -OY, FW, FH);

  if (k.action === "charge") {
    const charged = k.t >= C.chargeTime && k.fury >= C.energyCost;
    const grow = Math.min(k.t / C.chargeTime, 1);
    glow(38, -66, 10 + grow * 16, "#ff3344", charged ? 0.85 : 0.35 + 0.2 * Math.sin(k.t * 30));
    if (charged) glow(38, -66, 8, "#9ff3ff", 0.9);
  }
  if (k.action === "laser") {
    glow(C.eye.x, C.eye.y, k.t < C.laserWindup ? 10 : 18, "#ff3344", 0.9);
  }
  ctx.restore();
}

function drawGhosts() {
  ctx.globalCompositeOperation = "lighter";
  for (const g of ghosts) {
    ctx.save(); ctx.globalAlpha = g.t / 0.22 * 0.35;
    ctx.translate(g.x, g.y); ctx.scale(g.facing, 1);
    if (g.tilt) { ctx.translate(0, -60); ctx.rotate(-g.tilt); ctx.translate(0, 60); }
    ctx.drawImage(ATLAS, g.col * FW, g.row * FH, FW, FH, -OX, -OY, FW, FH);
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

function beamStroke(b, w, ramp, jitter) {
  const pulse = 1 + 0.2 * Math.sin(k.anim * 70) + (Math.random() - 0.5) * 0.15;
  ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  const layers = [[26, "#ff3344", 0.18], [12, "#ff3344", 0.9], [5, "#ffd6da", 1], [2, "#ffffff", 1]];
  for (const [lw, col, a] of layers) {
    ctx.globalAlpha = a * w; ctx.strokeStyle = col; ctx.lineWidth = lw * pulse * ramp;
    ctx.beginPath(); ctx.moveTo(b.ox, b.oy);
    ctx.lineTo(b.ex + (Math.random() - 0.5) * jitter, b.ey + (Math.random() - 0.5) * jitter); ctx.stroke();
  }
  if (b.hit) {                         // clarão em estrela no impacto
    ctx.globalAlpha = w; ctx.fillStyle = "#ffd6da";
    const r = 10 * pulse * ramp;
    ctx.beginPath(); ctx.arc(b.ex, b.ey, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff3344"; ctx.globalAlpha = 0.6 * w;
    ctx.fillRect(b.ex - r * 2.2, b.ey - 1, r * 4.4, 2); ctx.fillRect(b.ex - 1, b.ey - r * 2.2, 2, r * 4.4);
  }
  // brilho do visor na origem
  ctx.globalAlpha = w; ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(b.ox, b.oy, 5 * pulse * ramp, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}

function drawBeam() {
  if (k.beam) {
    const ramp = Math.min(1, (k.t - C.laserWindup) / 0.06 + 0.25);   // o feixe "abre" em 60 ms
    beamStroke(k.beam, 1, ramp, 3);
  } else if (k.beamFade && k.beamFade.t > 0) {
    const f = k.beamFade, kk = f.t / 0.1;
    // retração: o feixe solta-se do visor e encolhe até ao ponto de impacto
    beamStroke({ ...f, ox: f.ex - (f.ex - f.ox) * kk, oy: f.ey - (f.ey - f.oy) * kk, ex: f.ex, ey: f.ey, hit: false }, kk, kk, 0);
  }
}

function drawEnemy(e) {
  if (e.dead) return;
  ctx.save(); ctx.translate(e.x, e.y);
  const sq = (e.squash || 0) / 0.15;
  ctx.scale(1 + sq * 0.15, 1 - sq * 0.12);
  const h = e.h, w = e.w;
  ctx.fillStyle = e.flash > 0 ? "#fff" : "#5a3b2a"; ctx.fillRect(-w / 2, -h, w, h);
  ctx.fillStyle = e.flash > 0 ? "#fff" : "#a8682f"; ctx.fillRect(-w / 2 + 4, -h + 4, w - 8, 22);
  ctx.fillStyle = "#1a1d26"; ctx.fillRect(-8, -h + 12, 16, 4);
  ctx.fillStyle = "#2a1c14"; ctx.fillRect(-w / 2, -h / 2, w, 4);
  ctx.fillStyle = "#000a"; ctx.fillRect(-20, -h - 12, 40, 5);
  ctx.fillStyle = "#e2333f"; ctx.fillRect(-20, -h - 12, 40 * Math.max(e.hp, 0) / e.maxHp, 5);
  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = "#0d1016"; ctx.fillRect(camX - 50, -500, viewW + 100, 1500);
  // skyline em parallax
  ctx.fillStyle = "#141a26";
  for (let i = -2; i < 30; i++) {
    const bx = i * 140 + camX * 0.5, h = 120 + ((i * 73) % 5) * 40;
    ctx.fillRect(bx, 500 - h, 110, h);
  }
  ctx.fillStyle = "#1b2231";
  for (let i = -2; i < 30; i++) {
    const bx = i * 210 + 60 + camX * 0.25, h = 200 + ((i * 37) % 4) * 50;
    ctx.fillRect(bx, 500 - h - 40, 70, 40);
  }
}

function drawHud() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const x = 16 + safeLeft, y = 16 + safeTop;
  const bar = (label, v, max, col, yy) => {
    ctx.fillStyle = "#e8e3d6"; ctx.font = "12px Silkscreen, monospace"; ctx.fillText(label, x, yy + 11);
    ctx.fillStyle = "#000a"; ctx.fillRect(x + 50, yy, 160, 12);
    ctx.fillStyle = col; ctx.fillRect(x + 50, yy, 160 * v / max, 12);
    ctx.strokeStyle = "#e8e3d655"; ctx.strokeRect(x + 50.5, yy + .5, 159, 11);
  };
  bar("HP", k.hp, C.maxHp, "#3fbf5a", y);
  bar("FURY", k.fury, C.maxFury, "#d8323c", y + 20);
  ctx.fillStyle = "#8a8f9c"; ctx.font = "10px Silkscreen, monospace";
  ctx.fillText(k.flying ? "MODO: VOO" : "MODO: SOLO", x, y + 52);
}

function render() {
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  shake = Math.max(0, shake * 0.86 - 0.15);
  camX += (Math.max(0, Math.min(WORLD_W - viewW, k.x - viewW / 2)) - camX) * 0.15;
  const camY = 540 - viewH;
  ctx.setTransform(scale, 0, 0, scale, (-camX + sx) * scale, (-camY + sy) * scale);
  drawBackground();
  ctx.fillStyle = "#232a38";
  for (const s of solids) ctx.fillRect(s.x, s.y, s.w, s.h);
  ctx.fillStyle = "#c8973f33";
  for (const s of solids) ctx.fillRect(s.x, s.y, s.w, 3);
  drawParticles("back");
  enemies.forEach(drawEnemy);
  drawGhosts();
  drawKane();
  drawBeam();
  drawRings();
  drawParticles("front");
  ctx.textAlign = "center";
  for (const f of floats) {
    const age = 0.7 - f.t, pop = age < 0.08 ? 1 + (0.08 - age) * 8 : 1;   // números "saltam" ao aparecer
    ctx.globalAlpha = Math.min(f.t * 2, 1);
    ctx.fillStyle = f.big ? "#9ff3ff" : "#fff"; ctx.font = Math.round((f.big ? 18 : 12) * pop) + "px Silkscreen, monospace";
    ctx.fillText(f.v, f.x, f.y - Math.min(age, 0.25) * 120 - age * 20);
  }
  ctx.globalAlpha = 1; ctx.textAlign = "left";
  drawHud();
  if (screenFlash > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = screenFlash / 0.08 * 0.35; ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- loop (passo fixo 60 Hz)
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  acc += Math.min((now - last) / 1000, 0.1); last = now;
  while (acc >= STEP) {
    if (hitstop > 0) hitstop -= STEP;               // hit-stop: o mundo congela, o input fica guardado
    else { updateKane(STEP); updateEnemies(STEP); Object.assign(prev, held); }
    updateFx(STEP);
    if (k.beamFade) k.beamFade.t -= STEP;
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
